apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: poi-io-hpa
  namespace: poi-atividade5
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: poi-io
  minReplicas: 1
  maxReplicas: 2
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
