apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: poi-io-vpa
  namespace: poi-atividade5
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: poi-io
  updatePolicy:
    updateMode: "Off"
  resourcePolicy:
    containerPolicies:
      - containerName: io
        controlledResources:
          - cpu
          - memory
        minAllowed:
          cpu: 50m
          memory: 64Mi
        maxAllowed:
          cpu: "1"
          memory: 512Mi
