apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: poi-cpu-vpa
  namespace: poi-atividade5
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: poi-cpu
  updatePolicy:
    updateMode: "InPlaceOrRecreate"
  resourcePolicy:
    containerPolicies:
      - containerName: cpu
        controlledResources:
          - cpu
          - memory
        minAllowed:
          cpu: 100m
          memory: 64Mi
        maxAllowed:
          cpu: "1"
          memory: 512Mi
