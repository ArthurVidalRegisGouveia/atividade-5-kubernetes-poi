apiVersion: apps/v1
kind: Deployment
metadata:
  name: poi-cpu
  namespace: poi-atividade5
spec:
  replicas: 1
  selector:
    matchLabels:
      app: poi-cpu
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: poi-cpu
    spec:
      containers:
        - name: cpu
          image: arthuurvidaal/poi-cpu:atividade4
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8001
          env:
            - name: CPU_LIMITE_MAX
              value: "1000000"
          resources:
            requests:
              cpu: 500m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
