apiVersion: apps/v1
kind: Deployment
metadata:
  name: poi-memory
  namespace: poi-atividade5
spec:
  replicas: 1
  selector:
    matchLabels:
      app: poi-memory
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: poi-memory
    spec:
      containers:
        - name: memory
          image: arthuurvidaal/poi-memory:atividade4
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8002
          env:
            - name: MEMORY_RETENCAO_SEGUNDOS
              value: "1"
            - name: MEMORY_LIMITE_MAX_MB
              value: "64"
            - name: MEMORY_MAX_SIMULTANEAS
              value: "4"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
